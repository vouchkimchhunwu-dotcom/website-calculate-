<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculate</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    .calculator {
        background: #333;
        padding: 20px;
        border-radius: 20px;
        width: 300px;
    }

    .display {
        width: 100%;
        height: 60px;
        background: #222;
        color: white;
        font-size: 28px;
        border: none;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: right;
        padding-right: 10px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        height: 55px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .number {
        background: #555;
        color: white;
    }

    .operator {
        background: orange;
        color: white;
    }

    .clear {
        background: red;
        color: white;
    }

    .equal {
        background: #3ccf5e;
        color: white;
        grid-row: span 2;
    }

    .zero {
        grid-column: span 2;
    }

    
</style>
<body>
    <div class="calculator">
        <input type="text" id="display" class="display" disabled>
        <div class="buttons">
            <button class="clear" onclick="cleardisplay()">C</button>
            <button class="operator" onclick="deletelast()">Del</button>
            <button class="operator" onclick="oppend('/')">/</button>
            <button class="operator" onclick="oppend('*')">*</button>

            <button class="number" onclick="append('7')">7</button>
            <button class="number" onclick="append('8')">8</button>
            <button class="number" onclick="append('9')">9</button>
            <button class="operator" onclick="append('-')">-</button>

            <button class="number" onclick="append('4')">4</button>
            <button class="number" onclick="append('5')">5</button>
            <button class="number" onclick="append('6')">6</button>
            <button class="operator" onclick="append('+')">+</button>

            <button class="number" onclick="append('1')">1</button>
            <button class="number" onclick="append('2')">2</button>
            <button class="number" onclick="append('3')">3</button>
            <button class="equal" onclick="calculate('=')">=</button>

            <button class="number zero" onclick="append('0')">0</button>
            <button class="number" onclick="append('.')">.</button>

        </div>
    </div>

    <Script>
          let display = document.getElementById("display");

    function append(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }
         
    </Script>
    
</body>
</html>
